[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-data-pipeline"
version = "0.1.0"
description = "Simple BESS-focused data pipeline using Energy-Charts and Streamlit."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "plotly>=5.22",
    "pyarrow>=16",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
bess-fetch = "bess_pipeline.fetch:main"

[tool.setuptools.packages.find]
include = ["bess_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "integration: calls the live Energy-Charts API",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".venv",
    ".tmp",
    ".pytest_cache",
    "pytest-cache-files-*",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
